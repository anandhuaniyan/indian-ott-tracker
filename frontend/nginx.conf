server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://image.tmdb.org http://localhost:8000; style-src 'self'; script-src 'self' https://www.googletagmanager.com https://pagead2.googlesyndication.com; connect-src 'self' http://localhost:8000 https://www.google-analytics.com; frame-src https://googleads.g.doubleclick.net; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  location / { try_files $uri $uri/ /index.html; }
}
