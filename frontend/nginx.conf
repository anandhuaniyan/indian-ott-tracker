map $http_x_forwarded_proto $proxy_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_proto $redirect_to_https {
  default 0;
  http 1;
}

server {
  listen 80;
  server_name otttracker.in www.otttracker.in localhost _;
  root /usr/share/nginx/html;
  index index.html;
  if ($host = www.otttracker.in) { return 308 https://otttracker.in$request_uri; }
  if ($redirect_to_https) { return 308 https://$host$request_uri; }
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://i.ytimg.com https://ep1.adtrafficquality.google/pagead/sodar data: blob: https://image.tmdb.org https://www.google-analytics.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net; style-src 'self'; style-src-attr 'unsafe-hashes' 'sha256-CZH5K2nndphreqYNWZZyQNQjeySnWuXbVHgrqdue+wk='; script-src 'self' https://ep2.adtrafficquality.google/sodar/sodar2.js https://www.googletagmanager.com https://pagead2.googlesyndication.com; connect-src 'self' https://ep1.adtrafficquality.google/getconfig/sodar https://www.google-analytics.com https://region1.google-analytics.com https://www.google.com/g/collect https://analytics.google.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com; frame-src https://ep2.adtrafficquality.google https://www.google.com https://www.youtube-nocookie.com https://googleads.g.doubleclick.net; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }
  location /media/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }
  location /storage/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }
  location ~ ^/(robots\.txt|sitemap\.xml|ads\.txt|sitemaps/.*\.xml)$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }
  location / { try_files $uri $uri/ /index.html; }
}
