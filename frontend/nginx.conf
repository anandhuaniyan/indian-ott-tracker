map $http_x_forwarded_proto $proxy_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_proto $redirect_to_https {
  default 0;
  http 1;
}

# Cloudflare overwrites this header at the edge. Do not append a client-supplied
# X-Forwarded-For chain, which would let public callers rotate rate-limit keys.
map $http_cf_connecting_ip $trusted_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

# Detect crawler user-agents so they receive server-rendered HTML instead of
# the client-side SPA shell. The regex is intentionally broad to cover all
# major crawlers and social preview bots.
map $http_user_agent $is_crawler {
  default 0;
  ~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|sogou|pinterestbot|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|applebot|amazonbot|mj12bot|ahrefsbot|semrushbot|bytespider|kirimai|youindex|cocrawler) 1;
}

# Determine if a request URI is a public route eligible for server-side rendering.
# Admin, API, auth, and other internal paths are excluded.
map $uri $is_public_route {
  default 0;
  ~^/movies/[0-9]+$ 1;
  ~^/people/[0-9]+$ 1;
  ~^/genres/[a-z-]+$ 1;
  ~^/languages/[a-z][a-z]$ 1;
  ~^/ott 1;
  ~^/calendar 1;
  ~^/discover 1;
  ~^/search 1;
  ~^/about 1;
  ~^/methodology 1;
  ~^/editorial-policy 1;
  ~^/sources 1;
  ~^/corrections 1;
  ~^/contact 1;
  ~^/privacy 1;
  ~^/terms 1;
  ~^/cookies 1;
  ~^/$ 1;
}

# Combine crawler detection + public route check.
# "11" = crawler + public route -> trigger server-side render via error_page.
map "$is_crawler$is_public_route" $render_for_crawler {
  default 0;
  "11" 1;
}

# Crawlers that are NOT on a public route should get 404 (not the SPA shell).
# Browsers (non-crawlers) continue to get SPA behavior for all routes.
map "$is_crawler$is_public_route" $crawler_should_404 {
  default 0;
  "10" 1;
}

server {
  listen 80;
  server_name otttracker.in www.otttracker.in localhost _;
  # Resolve the Compose service name at request time so an API container
  # recreation does not leave Nginx pinned to the previous container IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  root /usr/share/nginx/html;
  index index.html;
  if ($host = www.otttracker.in) { return 308 https://otttracker.in$request_uri; }
  if ($redirect_to_https) { return 308 https://$host$request_uri; }
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://i.ytimg.com https://ep1.adtrafficquality.google/pagead/sodar data: blob: https://image.tmdb.org https://www.google-analytics.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net; style-src 'self'; style-src-attr 'unsafe-hashes' 'sha256-CZH5K2nndphreqYNWZZyQNQjeySnWuXbVHgrqdue+wk='; script-src 'self' https://ep2.adtrafficquality.google/sodar/sodar2.js https://www.googletagmanager.com https://pagead2.googlesyndication.com; connect-src 'self' https://ep1.adtrafficquality.google/getconfig/sodar https://www.google-analytics.com https://region1.google-analytics.com https://www.google.com/g/collect https://analytics.google.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com; frame-src https://ep2.adtrafficquality.google https://www.google.com https://www.youtube-nocookie.com https://googleads.g.doubleclick.net; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }

  location /media/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }

  # Storage is private by default. Public assets are served only from /media/.
  location ^~ /storage/ { return 404; }
  location ~* \.(?:dump|sql|sql\.gz|bak|backup|env|key|pem|sqlite|sqlite3|db|tar|tgz|zip|7z)$ { return 404; }

  # Static assets that should always be served regardless of crawler detection.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
  }

  # Sitemaps and robots.txt are served by the API.
  location ~ ^/(robots\.txt|ads\.txt|sitemap\.xml|sitemap-static\.xml|sitemap-updates\.xml)$ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }
  location ~ ^/sitemap-(movies|people)-[1-9][0-9]*\.xml$ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
  }

  # Internal location that proxies to the API's /_render endpoint.
  # Sends the original URI path as form body so the API can fetch route-specific data.
  location @crawler_render {
    internal;
    proxy_pass $api_upstream/_render;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    proxy_set_header Content-Type "application/x-www-form-urlencoded";
    proxy_set_body "path=$uri";
  }

  # Public routes eligible for server-side rendering.
  # When the request is flagged for rendering (crawler + public route),
  # use error_page trick to internally redirect to @crawler_render.
  # For crawlers on non-public routes, return 404 instead of SPA shell.
  location / {
    if ($crawler_should_404) {
      return 404;
    }
    if ($render_for_crawler) {
      error_page 418 = @crawler_render;
      return 418;
    }
    try_files $uri $uri/ /index.html;
  }
}
