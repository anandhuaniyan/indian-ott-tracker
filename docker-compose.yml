services:

  postgres:
    image: postgres:16
    container_name: indian_ott_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: ott_password
      POSTGRES_DB: ott_tracker

    volumes:
      - ott_postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    networks:
      - indian_ott_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ott_user -d ott_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4
    container_name: indian_ott_pgadmin
    restart: unless-stopped
    profiles: ["tools"]

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@otttracker.com
      PGADMIN_DEFAULT_PASSWORD: admin_password

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - indian_ott_network


  redis:
    image: redis:7-alpine
    container_name: indian_ott_redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    networks:
      - indian_ott_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: indian_ott_api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app
      - ott_media_data:/app/media

    networks:
      - indian_ott_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
        VITE_SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID:-}
        VITE_ADSENSE_SLOT_ID: ${VITE_ADSENSE_SLOT_ID:-}
        VITE_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - indian_ott_network

  worker:
    build: .
    env_file: .env
    command: sh -c "mkdir -p /app/media && chmod -R a+rwX /app/media && exec celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --uid=nobody --gid=nogroup"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ott_media_data:/app/media
    networks:
      - indian_ott_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5

  beat:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO --uid=nobody --gid=nogroup --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - indian_ott_network
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 5


networks:

  indian_ott_network:
    name: indian_ott_network


volumes:

  ott_postgres_data:
  ott_media_data:
